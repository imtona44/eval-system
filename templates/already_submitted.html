<!DOCTYPE html>
<html>
<head>
    <title>Already Submitted</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .alert-container {
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            padding: 40px;
            max-width: 600px;
            margin: 50px auto;
            text-align: center;
        }
        .warning-icon {
            font-size: 72px;
            color: #dc3545;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="alert-container">
                    <div class="warning-icon">⚠️</div>
                    <h2 class="mb-3 text-danger">Evaluation Already Submitted</h2>
                    <p class="lead mb-4">You have already submitted an evaluation for this session.</p>
                    
                    <div class="d-grid gap-2 d-md-block">
                        <a href="{{ url_for('view_submission', name=name) }}" class="btn btn-primary btn-lg me-md-2">
                            View My Evaluation
                        </a>
                        <a href="/" class="btn btn-outline-secondary btn-lg">
                            Submit New Evaluation
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
